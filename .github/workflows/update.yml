name: Update fantasy intel

on:
  schedule:
    - cron: "17 */2 * * *"         # every 2 hours, all week
    - cron: "*/30 17-23 * * 0"     # Sundays every 30 min, 1pm-7:30pm ET
    - cron: "*/30 0-4 * * 1,2,5"   # Sunday/Monday/Thursday night games
  workflow_dispatch: {}            # "Run workflow" button for an instant refresh

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fantasy-intel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore downloaded data
        uses: actions/cache@v4
        with:
          path: data_cache
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Build ratings and dashboard
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
        run: python -m ffintel.run

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub pauses scheduled jobs in repos with no commits for 60 days.
      # This adds an empty commit every ~45 days so the season never stalls.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 3900000 ]; then
            git config user.name "fantasy-intel-bot"
            git config user.email "fantasy-intel-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
